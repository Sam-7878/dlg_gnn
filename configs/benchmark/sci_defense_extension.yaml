workflow: sci_defense_extension
experiment:
  output_root: outputs/sci_defense_extension
  frozen_round5_root: outputs/sci_round5_final
  execution_origin: defense_extension_new
  auto_start: false
data:
  processed_dir: outputs/sci_defense_extension/processed
  fixed_dataset_seed: 42
datasets: [DARPA-TC-THEIA, LANL-RedTeam]
display_names:
  DARPA-TC-THEIA: DARPA-TC-THEIA
  LANL-RedTeam: LANL-RedTeam
models: [DOMINANT, AnomalyDAE, CoLA, CONAD, GADNR, OCGNN, DLG-Base, DLG-Aug]
seeds: [42, 43, 44, 45, 46]
training:
  epochs: 50
  dlg_l1_epochs: 20
  early_stopping: false
execution:
  gpu: 0
  fresh_subprocess_per_cell: true
  max_run_wall_hours: 24
  partition_fallback: false
  cpu_fallback: false
  approximation_used: false
  deterministic: true
backend:
  message: sparse_fused
  linear_reconstruction: exact_sparse
  anomalydae_reconstruction: chunked_exact
  linear_score_chunk_size: 8192
  anomalydae_score_chunk_size: 256
evaluation:
  validation_ratio: 0.2
  test_ratio: 0.2
  fixed_05: false
analysis:
  ci_method: t_95_seed_level
  topology_bootstrap_iterations: 2000
