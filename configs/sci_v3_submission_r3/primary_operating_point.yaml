version: 3
output_root: results/sci_v3_submission_r3
source_config: configs/sci_v3_submission/production_closure.yaml
selection_config: configs/sci_v3_submission_r2/closure.yaml
checkpoint_root: results/sci_v3_submission/checkpoints
graph_cache: results/sci_v3_submission/cache/bounded_graphs.pt
raw_events: results/sci_v3_submission/profiling/raw_events_100000.parquet
seeds: [11, 22, 33, 44, 55]
primary_seed: 11
statistical_track: B
track_reason: >-
  Predeclared before R3 test evaluation. Five existing frozen production models;
  prioritize policy-correct streaming, memory instrumentation and paired effect sizes.
  Accuracy remains descriptive regardless of the resulting p-values.
mc_selection:
  candidates: [1, 3, 5, 8]
  partition: validation
  seed: 11
  rule: smallest_T_with_calibrated_validation_F1_within_0.01_of_best
  tolerance: 0.01
relation:
  source: frozen_training_GIN_embeddings_and_scores
  neighbors_ref: level2.knn_k
  mode: independent_target_star
  reason: same frozen reference and independent target graph in all three lanes
runtime:
  warmup_events: 25
  events: 500
  repeats: 5
streaming:
  events: 100000
  policies: [primary, full_deep]
  memory_checkpoint: 1000
  restart_checkpoint: 50000
  max_active_contracts: 5000
  max_trace_rows: 1000
  horizon_limit_reason: only a frozen 100k real-event source is available; do not relabel repetitions as new chronological evidence
statistics:
  bootstrap_seed: 20260906
  resamples: 2000
  alpha: 0.05
risk:
  budgets: [0.0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.0]
  delta: 0.05
display_names:
  primary: Primary selective policy
  full_deep: Full relational inference
  direct_only: Local fast path only
  legacy_dual: Legacy dual-threshold diagnostic
  legacy_risk_controlled: Legacy empirical-risk diagnostic
