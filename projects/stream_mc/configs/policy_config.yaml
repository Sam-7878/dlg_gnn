revision: DLG-SelectiveStream-R01
role: descriptive specification; fitted per-seed values are in policy_fit.json
scope: retrospective_contract_snapshot_and_systems_replay
historical_test_already_inspected: true
fit_partition: source_validation
calibration_and_policy_reuse_partition: true
calibration:
  method: Platt_log_odds
  clip: 0.000001
  C: 1
  local_and_relational_maps: separate
fusion:
  rule: sigmoid_of_weighted_calibrated_log_odds
  local_weights: [0, 0.25, 0.5, 0.75, 1]
  objective: validation_F1
  tie_break: closest_to_0.5_then_larger_weight
threshold:
  objective: validation_F1
  tie_break: largest_threshold
  local_threshold: separate_control
  selective_final_threshold: shared_by_direct_and_deep
  threshold_only_control: calibrated_local_at_selective_final_threshold
routing:
  primary: margin
  primary_validation_budget: 0.25
  budgets: [0, 0.1, 0.25, 0.5, 0.75, 1]
  quantile: higher_order_statistic_on_source_validation
  boundary_ties_escalate: true
  q0: force_no_requested_deep
  q1: force_requested_deep_before_eligibility_fallback
  score_margin: negative_absolute_distance_from_local_threshold
  score_entropy: binary_entropy_of_calibrated_local_probability
  random_replicates: [0, 1, 2]
  random_validation_seed: seed_times_1000_plus_repeat
  random_test_seed: validation_seed_plus_1000000
  learned_benefit: Ridge_alpha_1_validation_log_loss_gain
  learned_features: [raw_local_probability, raw_entropy, raw_variance, embedding_norm]
  learned_selection: five_fold_validation_crossfit_then_source_validation_refit
  test_top_q_ranking: false
fallbacks:
  empty_graph: abstention
  nonfinite_local: abstention
  no_eligible_reference: calibrated_local_at_same_final_threshold
  nonfinite_relational: calibrated_local_at_same_final_threshold
  soft_timeout: calibrated_local_at_same_final_threshold_not_kernel_cancellation
  cache_miss: immutable_reference_reload
mc:
  passes: [1, 3, 5, 8]
  T1: deterministic_entropy_error_ranking
  T_over_1: dropout_only_population_variance_error_ranking
  batchnorm_and_stateful_layers: frozen
  calibration_and_threshold: separate_source_validation_fit_per_T
