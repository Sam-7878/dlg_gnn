[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tds-observation-audit"
version = "0.1.0"
description = "Observation ordering, cutoff and baseline audits"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn"]

[project.scripts]
tds-audit = "tds_audit:main"

[tool.setuptools]
py-modules = ["tds_audit"]
